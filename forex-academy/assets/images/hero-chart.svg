<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" width="100%" height="100%" style="font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243D"/>
      <stop offset="100%" stop-color="#0C1728"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2DEB0"/>
      <stop offset="50%" stop-color="#C8A96A"/>
      <stop offset="100%" stop-color="#9E7E3C"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C8A96A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1426" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="bearRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <linearGradient id="tpZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="slZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="terminalShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Terminal -->
  <rect x="0" y="0" width="740" height="560" fill="url(#ambientGlow)"/>

  <!-- Main Institutional Terminal Container -->
  <g filter="url(#terminalShadow)">
    <rect x="20" y="20" width="700" height="520" rx="16" fill="url(#terminalBg)" stroke="rgba(200, 169, 106, 0.3)" stroke-width="1.5"/>
  </g>

  <!-- Terminal Top Header Bar -->
  <rect x="20" y="20" width="700" height="54" rx="16" fill="#0B1426" fill-opacity="0.9"/>
  <line x1="20" y1="74" x2="720" y2="74" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Status Lights -->
  <circle cx="46" cy="47" r="4.5" fill="#EF4444" fill-opacity="0.9"/>
  <circle cx="62" cy="47" r="4.5" fill="#F59E0B" fill-opacity="0.9"/>
  <circle cx="78" cy="47" r="4.5" fill="#10B981" fill-opacity="0.9"/>

  <!-- Pair & Periodicity Identifier -->
  <g transform="translate(105, 38)">
    <text font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">EUR / USD</text>
    <rect x="82" y="-11" width="32" height="18" rx="4" fill="rgba(200, 169, 106, 0.15)"/>
    <text x="98" y="2" font-size="9" font-weight="700" fill="#C8A96A" text-anchor="middle" font-family="'DM Mono', monospace">4H</text>
    <text x="126" y="2" font-size="11" fill="#94A3B8" font-family="'DM Mono', monospace">BID: 1.08848</text>
    <text x="212" y="2" font-size="11" fill="#94A3B8" font-family="'DM Mono', monospace">ASK: 1.08850</text>
    <text x="300" y="2" font-size="10" fill="#10B981" font-weight="600">SPREAD: 0.2 PIPS</text>
  </g>

  <!-- Live Simulation Badge -->
  <g transform="translate(540, 36)">
    <rect x="0" y="-8" width="160" height="26" rx="13" fill="#0B1426" stroke="rgba(200, 169, 106, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="5" r="3.5" fill="#C8A96A"/>
    <text x="28" y="9" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">MT5 DEMO LAB</text>
  </g>

  <!-- Chart Grid Area -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3">
    <!-- Horizontal Gridlines -->
    <line x1="40" y1="125" x2="650" y2="125"/>
    <line x1="40" y1="185" x2="650" y2="185"/>
    <line x1="40" y1="245" x2="650" y2="245"/>
    <line x1="40" y1="305" x2="650" y2="305"/>
    <line x1="40" y1="365" x2="650" y2="365"/>
    <line x1="40" y1="425" x2="650" y2="425"/>

    <!-- Vertical Gridlines -->
    <line x1="120" y1="85" x2="120" y2="465"/>
    <line x1="210" y1="85" x2="210" y2="465"/>
    <line x1="300" y1="85" x2="300" y2="465"/>
    <line x1="390" y1="85" x2="390" y2="465"/>
    <line x1="480" y1="85" x2="480" y2="465"/>
    <line x1="570" y1="85" x2="570" y2="465"/>
  </g>

  <!-- Price Scale on Right Side -->
  <g font-size="10.5" fill="#64748B" font-family="'DM Mono', monospace">
    <text x="660" y="129">1.09600</text>
    <text x="660" y="189">1.09200</text>
    <text x="660" y="249">1.08800</text>
    <text x="660" y="309">1.08400</text>
    <text x="660" y="369">1.08000</text>
    <text x="660" y="429">1.07600</text>
  </g>

  <!-- Key Resistance / Supply Level -->
  <rect x="40" y="120" width="605" height="16" fill="rgba(244, 63, 94, 0.08)" rx="4"/>
  <line x1="40" y1="128" x2="645" y2="128" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <g transform="translate(48, 116)">
    <rect x="-4" y="-10" width="165" height="16" rx="3" fill="#14243D" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
    <text x="4" y="2" font-size="9" font-weight="700" fill="#F43F5E" letter-spacing="0.5">MAJOR RESISTANCE (1.09600)</text>
  </g>

  <!-- Key Support Level (Higher Low Base) -->
  <rect x="40" y="365" width="605" height="18" fill="rgba(200, 169, 106, 0.08)" rx="4"/>
  <line x1="40" y1="374" x2="645" y2="374" stroke="#C8A96A" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <g transform="translate(48, 362)">
    <rect x="-4" y="-10" width="180" height="16" rx="3" fill="#14243D" stroke="rgba(200, 169, 106, 0.3)" stroke-width="1"/>
    <text x="4" y="2" font-size="9" font-weight="700" fill="#C8A96A" letter-spacing="0.5">ESTABLISHED SUPPORT (1.08000)</text>
  </g>

  <!-- Trendline (Educational Market Structure) -->
  <path d="M70 415 L250 330 L450 205" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65"/>

  <!-- Candlesticks Sequence -->
  <!-- Candle 1: Bearish -->
  <line x1="75" y1="275" x2="75" y2="385" stroke="#F43F5E" stroke-width="1.5"/>
  <rect x="69" y="295" width="12" height="65" rx="1.5" fill="url(#bearRed)"/>

  <!-- Candle 2: Bullish Rejection -->
  <line x1="105" y1="335" x2="105" y2="400" stroke="#10B981" stroke-width="1.5"/>
  <rect x="99" y="348" width="12" height="38" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 3: Bullish expansion -->
  <line x1="135" y1="305" x2="135" y2="368" stroke="#10B981" stroke-width="1.5"/>
  <rect x="129" y="312" width="12" height="42" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 4: Retracement -->
  <line x1="165" y1="310" x2="165" y2="352" stroke="#F43F5E" stroke-width="1.5"/>
  <rect x="159" y="322" width="12" height="20" rx="1.5" fill="url(#bearRed)"/>

  <!-- Candle 5: Bullish impulse -->
  <line x1="195" y1="265" x2="195" y2="335" stroke="#10B981" stroke-width="1.5"/>
  <rect x="189" y="275" width="12" height="52" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 6: Higher Low pause -->
  <line x1="225" y1="270" x2="225" y2="308" stroke="#10B981" stroke-width="1.5"/>
  <rect x="219" y="278" width="12" height="22" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 7: Pullback to retest Higher Low -->
  <line x1="255" y1="275" x2="255" y2="320" stroke="#F43F5E" stroke-width="1.5"/>
  <rect x="249" y="282" width="12" height="26" rx="1.5" fill="url(#bearRed)"/>

  <!-- Candle 8: Entry Confirmation Pin Bar -->
  <line x1="285" y1="255" x2="285" y2="310" stroke="#10B981" stroke-width="1.5"/>
  <rect x="279" y="262" width="12" height="24" rx="1.5" fill="url(#bullGreen)"/>

  <!-- ASYMMETRIC RISK-TO-REWARD PROJECTION BOX (1:3 MODEL) -->
  <!-- Target Zone (Green Profit Projection) -->
  <rect x="345" y="142" width="195" height="120" rx="6" fill="url(#tpZone)" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3"/>
  <g transform="translate(357, 164)">
    <text font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="0.5">TAKE PROFIT (TP): +60 PIPS</text>
    <text y="15" font-size="9.5" fill="#94A3B8" font-family="'DM Mono', monospace">Target: 1.09450 · Profit: +$300 (3.0%)</text>
  </g>

  <!-- Order Execution Line -->
  <line x1="320" y1="262" x2="560" y2="262" stroke="#C8A96A" stroke-width="1.5"/>
  <circle cx="320" cy="262" r="4.5" fill="#C8A96A"/>
  
  <g transform="translate(565, 251)">
    <rect width="84" height="22" rx="4" fill="#C8A96A"/>
    <text x="42" y="15" font-size="10" font-weight="700" fill="#0B1426" text-anchor="middle" font-family="'DM Mono', monospace">ENTRY 1.0885</text>
  </g>

  <!-- Risk Zone (Red Stop Loss Box) -->
  <rect x="345" y="262" width="195" height="42" rx="6" fill="url(#slZone)" stroke="#F43F5E" stroke-width="1" stroke-dasharray="3 3"/>
  <g transform="translate(357, 287)">
    <text font-size="10.5" font-weight="700" fill="#F43F5E" letter-spacing="0.5">STOP LOSS (SL): -20 PIPS</text>
    <text y="13" font-size="9.5" fill="#94A3B8" font-family="'DM Mono', monospace">Cap: 1.08650 · Max Risk: $100 (1.0%)</text>
  </g>

  <!-- Candle 9: Expansion from Entry -->
  <line x1="315" y1="228" x2="315" y2="272" stroke="#10B981" stroke-width="1.5"/>
  <rect x="309" y="238" width="12" height="30" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 10: Momentum candle -->
  <line x1="345" y1="200" x2="345" y2="246" stroke="#10B981" stroke-width="1.5"/>
  <rect x="339" y="210" width="12" height="34" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Candle 11: Brief pause -->
  <line x1="375" y1="205" x2="375" y2="232" stroke="#F43F5E" stroke-width="1.5"/>
  <rect x="369" y="212" width="12" height="15" rx="1.5" fill="url(#bearRed)"/>

  <!-- Candle 12: Continuation toward target -->
  <line x1="405" y1="155" x2="405" y2="218" stroke="#10B981" stroke-width="1.5"/>
  <rect x="399" y="165" width="12" height="48" rx="1.5" fill="url(#bullGreen)"/>

  <!-- Educational Ledger Footer Inside Terminal -->
  <g transform="translate(40, 460)">
    <!-- Metric 1: Risk-to-Reward -->
    <rect width="190" height="56" rx="8" fill="#0B1426" stroke="rgba(200, 169, 106, 0.4)" stroke-width="1"/>
    <text x="14" y="22" font-size="9" font-weight="700" fill="#C8A96A" letter-spacing="1">RISK TO REWARD MODEL</text>
    <text x="14" y="44" font-size="16" font-weight="700" fill="#FFFFFF" font-family="'DM Mono', monospace">1 : 3.0</text>
    <text x="86" y="43" font-size="10.5" fill="#94A3B8">(Strict 1.0% Cap)</text>
  </g>

  <g transform="translate(245, 460)">
    <!-- Metric 2: Session Overlap -->
    <rect width="215" height="56" rx="8" fill="#0B1426" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="14" y="22" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1">MARKET SESSION OVERLAP</text>
    <text x="14" y="44" font-size="13" font-weight="600" fill="#FFFFFF">London / New York Peak</text>
  </g>

  <g transform="translate(475, 460)">
    <!-- Metric 3: Simulation Environment -->
    <rect width="195" height="56" rx="8" fill="#0B1426" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <text x="14" y="22" font-size="9" font-weight="700" fill="#10B981" letter-spacing="1">SIMULATION ENVIRONMENT</text>
    <text x="14" y="44" font-size="13" font-weight="600" fill="#FFFFFF">MT5 Demo Virtual Capital</text>
  </g>
</svg>
